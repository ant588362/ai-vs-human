name: Auto-generate daily puzzles

on:
  schedule:
    # Every day at 6am UTC — generates next 30 days, skips existing ones
    # Vercel auto-deploys on every push to main, so puzzles go live instantly
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger: GitHub → Actions → Run workflow

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate next 30 days of puzzles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run generate

      - name: Commit and push any new puzzle files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/daily/
          if git diff --staged --quiet; then
            echo "All puzzles already exist — nothing to commit."
          else
            NEW=$(git diff --staged --name-only | wc -l)
            git commit -m "chore: add $NEW new daily puzzles [skip ci]"
            git push
          fi
